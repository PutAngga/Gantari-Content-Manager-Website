<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gantari Content Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
    <div id="app">
        <!-- Dashboard Section -->
        <section id="dashboard-section">
            <nav class="top-nav glass-panel">
                <div class="brand-small">GANTARI CONTENT MANAGER</div>
                <div class="user-menu">
                    <span id="user-name">Welcome, Admin</span>
                    <button id="btn-logout" class="btn-text">Logout</button>
                </div>
            </nav>

            <main class="dashboard-content">
                <header class="dashboard-header">
                    <h2>Projects Overview</h2>
                    <div style="display: flex; gap: 10px;">
                        <button id="btn-sync-drive" class="btn-outline">Sync from Drive</button>
                        <button id="btn-new-project" class="btn-primary">+ New Project</button>
                    </div>
                </header>

                <div id="projects-container" class="projects-grid">
                    <!-- Project cards will be injected here -->
                </div>
            </main>
        </section>

        <!-- New Project Modal -->
        <div id="modal-new-project" class="modal" style="display: none;">
            <div class="modal-content glass-panel">
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <h3 style="margin-bottom: 20px;">Create New Project Folder</h3>
                <form id="new-project-form">
                    <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                        <div class="input-group" style="flex: 1; margin-bottom: 0;">
                            <label>Bride Name</label>
                            <input type="text" id="bride-name" placeholder="Nama Mempelai Wanita" required>
                        </div>
                        <div class="input-group" style="flex: 1; margin-bottom: 0;">
                            <label>Groom Name</label>
                            <input type="text" id="groom-name" placeholder="Nama Mempelai Pria" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Event Date</label>
                        <input type="date" id="event-date" required>
                    </div>
                    <div class="input-group">
                        <label>Events (Comma separated, e.g. Meeting 1, Gladi, Akad, Resepsi)</label>
                        <input type="text" id="project-events" placeholder="Meeting 1, Gladi, Akad, Resepsi" required>
                    </div>
                    <button type="submit" class="btn-primary" id="btn-create-folder">Create in Google Drive</button>
                </form>
                <div id="modal-status"></div>
            </div>
        </div>

        <!-- Edit Project Modal -->
        <div id="modal-edit-project" class="modal" style="display: none;">
            <div class="modal-content glass-panel">
                <span class="close-btn" onclick="closeEditModal()">&times;</span>
                <h3 style="margin-bottom: 5px;">Manage Project</h3>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 0.9rem; color: var(--color-text-muted); margin-bottom: 5px;">Project Name:</label>
                    <input type="text" id="edit-project-title" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: var(--color-gold); font-size: 0.95rem; font-family: inherit;" required>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 0.9rem; color: var(--color-text-muted); margin-bottom: 8px;">Existing Events:</label>
                    <div id="edit-existing-events" style="display: flex; flex-wrap: wrap; gap: 8px;">
                        <!-- Existing events injected here -->
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;">

                <form id="edit-project-form">
                    <input type="hidden" id="edit-project-id">
                    <input type="hidden" id="edit-folder-id">
                    <div class="input-group">
                        <label>Add New Events (Optional, Comma separated)</label>
                        <input type="text" id="edit-project-events" placeholder="e.g. Siraman, Pengajian">
                    </div>
                    <button type="submit" class="btn-primary" id="btn-update-folder">Simpan Perubahan</button>
                </form>
                <div id="modal-edit-status" style="margin-top: 15px;"></div>
            </div>
        </div>

        <!-- Sync Loading Modal -->
        <div id="modal-loading" class="modal"
            style="display: none; align-items: center; justify-content: center; z-index: 9999;">
            <div class="glass-panel"
                style="padding: 40px; text-align: center; border-color: var(--color-gold); min-width: 300px;">
                <h3 style="color: var(--color-gold); margin-bottom: 10px;">Syncing with Drive...</h3>
                <p style="color: var(--color-text-muted);">Mohon tunggu sebentar...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module" src="dashboard.js?v=20"></script>

    <script>
        function closeModal() {
            document.getElementById('modal-new-project').style.display = 'none';
        }
        function closeEditModal() {
            document.getElementById('modal-edit-project').style.display = 'none';
        }
    </script>
</body>

</html>
